services:
  - type: web
    name: elfaith-microfinance
    runtime: php
    plan: free
    region: frankfurt
    buildCommand: ""
    startCommand: "apache2-foreground"
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        value: "elfaith_microfinance"
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
