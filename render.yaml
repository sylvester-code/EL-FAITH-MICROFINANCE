services:
  - type: web
    name: elfaith-microfinance
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: "npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "24h"
      - key: TOTAL_LOAN_ALLOCATION
        value: "500000.00"
      - key: DATABASE_URL
        sync: false
